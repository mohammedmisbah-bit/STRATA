[build]
  command = "npm run build"
  publish = "dist/client"

# Serverless function handling and routing for the TanStack Start server are
# managed automatically by @netlify/vite-plugin-tanstack-start (see
# vite.config.ts), which writes a working ESM function to
# .netlify/v1/functions/server.mjs during the build. A manual [functions]
# block and redirect here previously pointed to a different, unbundled
# directory (node_bundler = "none"), which caused Netlify to try to load the
# ESM SSR output via CommonJS require() and crash with
# "SyntaxError: Unexpected token 'export'" on every request.

# Environment variable configuration
# Set these in Netlify Dashboard > Site settings > Environment variables:
# - GROQ_API_KEY (server-only, not exposed to client)
# - SUPABASE_SERVICE_ROLE_KEY (server-only, not exposed to client)
# - Any VITE_* prefixed variables (available to client if needed)
