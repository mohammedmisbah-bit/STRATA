[build]
  command = "npm run build"
  publish = "dist/client"

# The @netlify/vite-plugin-tanstack-start adapter registers the SSR function
# (.netlify/v1/functions/server.mjs, path "/*", preferStatic) during the build.
# No manual [functions] or [[redirects]] config is needed.
#
# Server-only secrets go in Netlify > Site settings > Environment variables:
#   GROQ_API_KEY, SUPABASE_SERVICE_ROLE_KEY
